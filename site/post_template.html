<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ TITLE }} — The AI Architect</title>
  <meta name="description" content="{{ DEK }}">
  <meta property="og:title" content="{{ TITLE }}">
  <meta property="og:description" content="{{ DEK }}">
  <meta property="og:type" content="article">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #F4F3EF;
      --surface:       #FFFFFF;
      --border:        #E4E3DF;
      --text:          #111111;
      --text-sub:      #444444;
      --text-muted:    #888888;
      --accent:        #2563EB;
      --header-bg:     #0D1117;
      --take-bg:       #FFFBEB;
      --take-border:   #F59E0B;
      --take-label:    #92400E;
      --source-bg:     #EFEFEB;
      --source-text:   #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #101010;
        --surface:       #1A1A1A;
        --border:        #2B2B2B;
        --text:          #EFEFEF;
        --text-sub:      #AAAAAA;
        --text-muted:    #666666;
        --accent:        #60A5FA;
        --header-bg:     #000000;
        --take-bg:       #1A1200;
        --take-border:   #D97706;
        --take-label:    #FCD34D;
        --source-bg:     #222222;
        --source-text:   #CCCCCC;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    .masthead {
      background: var(--header-bg);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }

    .masthead a {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 1rem;
    }

    .article-header { margin-bottom: 1.75rem; }

    .source-chip {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--source-bg);
      color: var(--source-text);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .article-title {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .article-dek {
      font-size: 1.05rem;
      color: var(--text-sub);
      margin-bottom: 0.6rem;
    }

    .article-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .article-body { font-size: 1rem; color: var(--text); }
    .article-body p { margin-bottom: 1.1rem; }

    .how-i-use-it {
      background: var(--take-bg);
      border-left: 3px solid var(--take-border);
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }

    .how-i-use-it-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--take-label);
      margin-bottom: 0.5rem;
    }

    .how-i-use-it p { margin: 0; }

    .example-projects {
      margin: 1.75rem 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .example-projects h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .example-projects ul { list-style: none; padding: 0; }
    .example-projects li { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .example-projects a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .example-projects a:hover { text-decoration: underline; }

    .inspired-by {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 1rem 0;
    }

    .inspired-by a { color: var(--accent); text-decoration: none; }

    .tag-row { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .tag-chip {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--source-bg);
      color: var(--source-text);
      padding: 0.18rem 0.6rem;
      border-radius: 20px;
    }

    .site-footer {
      max-width: 660px;
      margin: 1.5rem auto 0;
      padding: 1.5rem 1.25rem 2.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="masthead">
    <a href="../index.html">&larr; The AI Architect — Archive</a>
  </header>

  <div class="container">
    <div class="article-header">
      <span class="source-chip">{{ TECHNIQUE }}</span>
      <h1 class="article-title">{{ TITLE }}</h1>
      <p class="article-dek">{{ DEK }}</p>
      <p class="article-date">{{ DATE }}</p>
    </div>

    <div class="article-body">
{{ BODY_HTML }}
    </div>

    <div class="how-i-use-it">
      <p class="how-i-use-it-label">How I use this every day</p>
{{ HOW_I_USE_IT }}
    </div>

    <div class="example-projects">
      <h2>Example projects</h2>
      <ul>
{{ EXAMPLE_PROJECTS_HTML }}
      </ul>
    </div>

{{ INSPIRED_BY_HTML }}

    <div class="tag-row">
{{ TAGS_HTML }}
    </div>
  </div>

  <footer class="site-footer">
    Written by Luca La Malfa, with Claude &middot; <a href="../index.html">Back to the archive</a>
  </footer>

</body>
</html>
