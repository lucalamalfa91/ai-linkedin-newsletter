<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ TITLE }} — The AI Architect</title>
  <meta name="description" content="{{ DEK }}">
  <meta property="og:title" content="{{ TITLE }}">
  <meta property="og:description" content="{{ DEK }}">
  <meta property="og:type" content="article">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #F4F3EF;
      --surface:       #FFFFFF;
      --border:        #E4E3DF;
      --text:          #111111;
      --text-sub:      #444444;
      --text-muted:    #888888;
      --accent:        #2563EB;
      --header-bg:     #0D1117;
      --take-bg:       #FFFBEB;
      --take-border:   #F59E0B;
      --take-label:    #92400E;
      --source-bg:     #EFEFEB;
      --source-text:   #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #101010;
        --surface:       #1A1A1A;
        --border:        #2B2B2B;
        --text:          #EFEFEF;
        --text-sub:      #AAAAAA;
        --text-muted:    #666666;
        --accent:        #60A5FA;
        --header-bg:     #000000;
        --take-bg:       #1A1200;
        --take-border:   #D97706;
        --take-label:    #FCD34D;
        --source-bg:     #222222;
        --source-text:   #CCCCCC;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    .masthead {
      background: var(--header-bg);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }

    .masthead a {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 1rem;
    }

    .article-header { margin-bottom: 1.75rem; }

    .source-chip {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--source-bg);
      color: var(--source-text);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .article-title {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    .article-dek {
      font-size: 1.05rem;
      color: var(--text-sub);
      margin-bottom: 0.6rem;
    }

    .article-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ── BLOCKS (each article is an ordered list of these; which ones appear, how many,
       and in what order varies per article's editorial archetype — see config.py) ── */

    .prose-block { font-size: 1rem; color: var(--text); margin: 1.25rem 0; }
    .prose-block p { margin-bottom: 1.1rem; }
    .prose-block p:last-child { margin-bottom: 0; }

    /* ── DIAGRAMS ───────────────────────────────────────── */
    .diagram-figure {
      margin: 1.5rem 0;
    }

    .diagram-figure img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    /* ── CALLOUT: boxed treatment (deep-dive archetype) ──── */
    .callout-box {
      background: var(--take-bg);
      border-left: 3px solid var(--take-border);
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }

    .callout-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--take-label);
      margin-bottom: 0.5rem;
    }

    .callout-box p { margin: 0; }

    /* ── CALLOUT: pull-quote treatment (contrarian-take archetype) ── */
    .callout-pullquote {
      margin: 2rem 0;
      padding: 0.5rem 0 0.5rem 1.25rem;
      border-left: 3px solid var(--accent);
    }

    .pullquote-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .callout-pullquote p {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* ── QUOTE block (a short first-person pull-quote) ───── */
    .pull-quote {
      margin: 2rem 0;
      padding: 0 1.5rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1.4;
      color: var(--accent);
    }

    /* ── LIST block (how-to archetype checklist) ─────────── */
    .list-block { margin: 1.75rem 0; }

    .list-heading {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }

    .checklist { list-style: none; }

    .checklist li {
      display: flex;
      gap: 0.85rem;
      margin-bottom: 0.9rem;
      align-items: flex-start;
    }

    .checklist li:last-child { margin-bottom: 0; }

    .list-badge {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .list-item-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .list-item-detail { font-size: 0.85rem; color: var(--text-sub); margin-top: 0.2rem; }

    /* ── CODE PROJECT block ───────────────────────────────── */
    .project-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem 1.3rem;
      margin: 1.5rem 0;
    }

    .project-block-comparison { border-left: 3px solid var(--accent); }

    .comparison-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .project-name { font-size: 0.95rem; margin-bottom: 0.5rem; }
    .project-name a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .project-name a:hover { text-decoration: underline; }

    .project-usage-note {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 0.9rem;
    }

    .code-label, .output-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .output-label { margin-top: 0.9rem; }

    .code-block {
      background: #0D1117;
      color: #E6EDF3;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      font-size: 0.82rem;
      line-height: 1.55;
      overflow-x: auto;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
    }

    .code-block code { white-space: pre; }

    .terminal-output {
      background: #0D1117;
      border-radius: 8px;
      overflow: hidden;
    }

    .terminal-dots {
      display: flex;
      gap: 0.35rem;
      padding: 0.55rem 0.75rem;
      background: #161B22;
    }

    .terminal-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3A3F47;
      display: inline-block;
    }

    .terminal-output pre {
      color: #7EE787;
      font-size: 0.8rem;
      line-height: 1.55;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    .inspired-by {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 1rem 0;
    }

    .inspired-by a { color: var(--accent); text-decoration: none; }

    .tag-row { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .tag-chip {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--source-bg);
      color: var(--source-text);
      padding: 0.18rem 0.6rem;
      border-radius: 20px;
    }

    .site-footer {
      max-width: 660px;
      margin: 1.5rem auto 0;
      padding: 1.5rem 1.25rem 2.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="masthead">
    <a href="../index.html">&larr; The AI Architect — Archive</a>
  </header>

  <div class="container">
    <div class="article-header">
      <span class="source-chip">{{ TECHNIQUE }}</span>
      <h1 class="article-title">{{ TITLE }}</h1>
      <p class="article-dek">{{ DEK }}</p>
      <p class="article-date">{{ DATE }}</p>
    </div>

{{ BLOCKS_HTML }}

{{ INSPIRED_BY_HTML }}

    <div class="tag-row">
{{ TAGS_HTML }}
    </div>
  </div>

  <footer class="site-footer">
    Written by Luca La Malfa, with Claude &middot; <a href="../index.html">Back to the archive</a>
  </footer>

</body>
</html>
